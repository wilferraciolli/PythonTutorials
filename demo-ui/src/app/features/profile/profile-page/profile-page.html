<div class="ProfilePage App-page">
  <h1 class="ProfilePage-title">Profile</h1>

  @if (currentUser.me(); as me) {
    <section class="ProfilePage-identity">
      <span class="ProfilePage-avatar" aria-hidden="true">{{ me.name.charAt(0) }}</span>
      <div class="ProfilePage-who">
        <p class="ProfilePage-name">{{ me.name }}</p>
        <p class="ProfilePage-email">{{ me.email ?? 'No email on file' }}</p>
      </div>
    </section>

    <section class="ProfilePage-roles">
      <h2 class="ProfilePage-section">Roles</h2>
      <mat-chip-set aria-label="Roles">
        @for (role of me.roleIds; track role) {
          <mat-chip>{{ role }}</mat-chip>
        }
      </mat-chip-set>
    </section>
  } @else {
    <p class="ProfilePage-muted">Loading…</p>
  }
</div>
