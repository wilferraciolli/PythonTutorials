<article class="PostCard">
  <app-post-byline
    [author]="post().authorName"
    [date]="post().created_date"
    [groupId]="showGroup() ? post().groupId : null"
    [groupName]="showGroup() ? post().groupName : null"
  />

  <h2 class="PostCard-heading">
    <a class="PostCard-title" [routerLink]="['/groups', post().groupId, 'posts', post().id]">{{
      post().title
    }}</a>
  </h2>
  @if (post().body) {
    <p class="PostCard-body">{{ post().body }}</p>
  }

  @if (post().media; as media) {
    <app-post-media class="PostCard-media" [media]="media" [deferVideo]="true" [fill]="true" />
  }

  <div class="PostCard-actions">
    <button
      matButton
      type="button"
      [disabled]="!canLike() || busy()"
      [attr.aria-pressed]="post().likedByMe"
      [attr.aria-label]="'Like (' + post().likeCount + ')'"
      [title]="canLike() ? (post().likedByMe ? 'Unlike' : 'Like') : 'Join the group to like posts'"
      (click)="toggleLike()"
    >
      <mat-icon aria-hidden="true" [class.is-filled]="post().likedByMe">favorite</mat-icon>
      {{ post().likeCount }}
    </button>
    <a
      matButton
      [routerLink]="['/groups', post().groupId, 'posts', post().id]"
      [attr.aria-label]="'Comments (' + post().commentCount + ')'"
      title="Comments"
    >
      <mat-icon aria-hidden="true">chat_bubble</mat-icon>
      {{ post().commentCount }}
    </a>
  </div>

  @if (error(); as message) {
    <p class="PostCard-error" role="alert">{{ message }}</p>
  }
</article>
