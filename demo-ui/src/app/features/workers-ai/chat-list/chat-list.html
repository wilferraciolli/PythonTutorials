<div class="ChatList">
  @if (store.loadErrorMessage(); as errorMessage) {
    <p class="ChatList-error" role="alert">{{ errorMessage }}</p>
  } @else {
    <div class="ChatList-bar">
      @if (editing() && currentChat(); as chat) {
        <form class="ChatList-edit" (submit)="$event.preventDefault(); saveTitle(chat)">
          <mat-form-field class="ChatList-field" appearance="outline" subscriptSizing="dynamic">
            <mat-label>Chat name</mat-label>
            <input
              matInput
              maxlength="60"
              [value]="editingTitle()"
              (input)="editingTitle.set($any($event.target).value)"
              [disabled]="saving()"
            />
          </mat-form-field>
          <button
            matIconButton
            type="submit"
            aria-label="Save chat name"
            title="Save"
            [disabled]="saving()"
          >
            <mat-icon>check</mat-icon>
          </button>
          <button
            matIconButton
            type="button"
            aria-label="Cancel renaming"
            title="Cancel"
            [disabled]="saving()"
            (click)="cancelEditing()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </form>
      } @else {
        <div class="ChatList-pick">
          <mat-form-field class="ChatList-field" appearance="outline" subscriptSizing="dynamic">
            <mat-label>Chat</mat-label>
            <select
              matNativeControl
              aria-label="Chat session"
              [disabled]="store.chats().length === 0"
              (change)="openChat($any($event.target).value)"
            >
              <option value="" [selected]="!currentChat()" disabled>
                {{
                  store.isLoading()
                    ? 'Loading…'
                    : store.chats().length === 0
                      ? 'No chats yet'
                      : 'Select a chat…'
                }}
              </option>
              @for (chat of store.chats(); track chat.id) {
                <option [value]="chat.id" [selected]="chat.id === currentChatId()">
                  {{ chat.title }} · {{ providerLabel(chat.provider) }}
                </option>
              }
            </select>
          </mat-form-field>
          @if (currentChat(); as chat) {
            <button
              matIconButton
              type="button"
              aria-label="Rename chat"
              title="Rename chat"
              (click)="startEditing(chat)"
            >
              <mat-icon>edit</mat-icon>
            </button>
          }
        </div>
      }

      <div class="ChatList-new">
        <mat-form-field class="ChatList-provider" appearance="outline" subscriptSizing="dynamic">
          <mat-label>New chats use</mat-label>
          <select
            matNativeControl
            aria-label="Provider for new chats"
            (change)="selectProvider($any($event.target).value)"
          >
            <option value="cloudflare" [selected]="selectedProvider() === 'cloudflare'">
              Cloudflare Workers AI
            </option>
            <option value="groq" [selected]="selectedProvider() === 'groq'">Groq</option>
          </select>
        </mat-form-field>
        <button matButton="tonal" type="button" (click)="newChat()" [disabled]="creating()">
          <mat-icon>add</mat-icon>
          {{ creating() ? 'Creating…' : 'New chat' }}
        </button>
      </div>
    </div>

    @if (renameError(); as errorMessage) {
      <p class="ChatList-error" role="alert">{{ errorMessage }}</p>
    }
  }
</div>
