<div class="ChatList">
  @if (store.loadErrorMessage(); as errorMessage) {
    <p class="ChatList-error">{{ errorMessage }}</p>
  } @else {
    <div class="ChatList-row">
      @if (editing() && currentChat(); as chat) {
        <form class="ChatList-edit" (submit)="$event.preventDefault(); saveTitle(chat)">
          <input
            class="ChatList-control ChatList-editInput"
            aria-label="Chat name"
            maxlength="60"
            [value]="editingTitle()"
            (input)="editingTitle.set($any($event.target).value)"
            [disabled]="saving()"
          />
          <button matIconButton type="submit" aria-label="Save chat name" title="Save" [disabled]="saving()">
            <mat-icon aria-hidden="true">check</mat-icon>
          </button>
          <button
            matIconButton
            type="button"
            aria-label="Cancel renaming"
            title="Cancel"
            [disabled]="saving()"
            (click)="cancelEditing()"
          >
            <mat-icon aria-hidden="true">close</mat-icon>
          </button>
        </form>
      } @else {
        <select
          class="ChatList-control ChatList-select"
          aria-label="Chat session"
          [disabled]="store.chats().length === 0"
          (change)="openChat($any($event.target).value)"
        >
          <option value="" [selected]="!currentChat()" disabled>
            {{ store.isLoading() ? 'Loading…' : store.chats().length === 0 ? 'No chats yet' : 'Select a chat…' }}
          </option>
          @for (chat of store.chats(); track chat.id) {
            <option [value]="chat.id" [selected]="chat.id === currentChatId()">
              {{ chat.title }} · {{ providerLabel(chat.provider) }}
            </option>
          }
        </select>
        @if (currentChat(); as chat) {
          <button
            matIconButton
            type="button"
            aria-label="Rename chat"
            title="Rename chat"
            (click)="startEditing(chat)"
          >
            <mat-icon aria-hidden="true">edit</mat-icon>
          </button>
        }
      }
    </div>

    <div class="ChatList-row">
      <select
        class="ChatList-control ChatList-provider"
        aria-label="Provider for new chats"
        (change)="selectProvider($any($event.target).value)"
      >
        <option value="cloudflare" [selected]="selectedProvider() === 'cloudflare'">Cloudflare Workers AI</option>
        <option value="groq" [selected]="selectedProvider() === 'groq'">Groq</option>
      </select>
      <button matButton="filled" type="button" (click)="newChat()" [disabled]="creating()">
        <mat-icon aria-hidden="true">add</mat-icon>
        {{ creating() ? 'Creating…' : 'New chat' }}
      </button>
    </div>

    @if (renameError(); as errorMessage) {
      <p class="ChatList-error">{{ errorMessage }}</p>
    }
  }
</div>
