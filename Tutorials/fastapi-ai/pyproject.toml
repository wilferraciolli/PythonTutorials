[project]
name = "fastapi-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
    "wiltech-labs-ai>=1.0.1",
    "wiltech-labs-auth>=1.0.1",
    "wiltech-labs-core[sqlite]>=1.0.1",
    "wiltech-labs-rest>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
