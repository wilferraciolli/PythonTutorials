<div class="ProcedureForm">
  <h2 class="ProcedureForm-title">{{ isEditMode() ? 'Edit procedure' : 'Add new procedure' }}</h2>

  @if (loadExistingError()) {
    <p class="ProcedureForm-error">Couldn't load this procedure — check the API is reachable.</p>
  } @else if (loadingExisting()) {
    <p class="ProcedureForm-loading">Loading procedure…</p>
  } @else {
    <form [formRoot]="procedureForm" class="ProcedureForm-form">
      <label class="ProcedureForm-field">
        <span>Name<span class="App-required" aria-hidden="true">*</span></span>
        <input [formField]="procedureForm.name" aria-required="true" />
        @if (procedureForm.name().touched() && procedureForm.name().invalid()) {
          <span class="ProcedureForm-field-error">Required</span>
        }
      </label>

      <label class="ProcedureForm-field">
        <span>Category<span class="App-required" aria-hidden="true">*</span></span>
        <select [formField]="procedureForm.category" aria-required="true">
          <option value="">Select…</option>
          @for (category of categories; track category) {
            <option [value]="category">{{ category }}</option>
          }
        </select>
        @if (procedureForm.category().touched() && procedureForm.category().invalid()) {
          <span class="ProcedureForm-field-error">Required</span>
        }
      </label>

      <div class="ProcedureForm-row">
        <label class="ProcedureForm-field">
          <span>Typical duration (minutes)<span class="App-required" aria-hidden="true">*</span></span>
          <input type="number" [formField]="procedureForm.typical_duration_minutes" aria-required="true" />
          @if (procedureForm.typical_duration_minutes().touched() && procedureForm.typical_duration_minutes().invalid()) {
            <span class="ProcedureForm-field-error">At least 15 minutes</span>
          }
        </label>

        <label class="ProcedureForm-field">
          <span>Min duration (optional)</span>
          <input type="number" [formField]="procedureForm.min_duration_minutes" />
        </label>

        <label class="ProcedureForm-field">
          <span>Max duration (optional)</span>
          <input type="number" [formField]="procedureForm.max_duration_minutes" />
        </label>
      </div>

      <label class="ProcedureForm-field">
        <span>Description (optional)</span>
        <textarea rows="3" [formField]="procedureForm.description"></textarea>
      </label>

      @if (saveError()) {
        <p class="ProcedureForm-error">{{ saveError() }}</p>
      }

      <div class="ProcedureForm-actions">
        <a class="App-button App-button-ghost" routerLink="/admin/procedures">Cancel</a>
        <button type="submit" class="App-button App-button-primary" [disabled]="saving()">
          {{ saving() ? 'Saving…' : isEditMode() ? 'Update procedure' : 'Create procedure' }}
        </button>
      </div>
    </form>
  }
</div>
