<div class="WardForm">
  <h2 class="WardForm-title">{{ isEditMode() ? 'Edit ward' : 'Add new ward' }}</h2>

  @if (loadExistingError()) {
    <p class="WardForm-error">Couldn't load this ward — check the API is reachable.</p>
  } @else if (loadingExisting()) {
    <p class="WardForm-loading">Loading ward…</p>
  } @else {
    <form [formRoot]="wardForm" class="WardForm-form">
      <label class="WardForm-field">
        <span>Name<span class="App-required" aria-hidden="true">*</span></span>
        <input [formField]="wardForm.name" aria-required="true" />
        @if (wardForm.name().touched() && wardForm.name().invalid()) {
          <span class="WardForm-field-error">Required</span>
        }
      </label>

      <label class="WardForm-field">
        <span>Description (optional)</span>
        <textarea rows="3" [formField]="wardForm.description"></textarea>
      </label>

      @if (saveError()) {
        <p class="WardForm-error">{{ saveError() }}</p>
      }

      <div class="WardForm-actions">
        <a class="App-button App-button-ghost" routerLink="/admin/wards">Cancel</a>
        <button type="submit" class="App-button App-button-primary" [disabled]="saving()">
          {{ saving() ? 'Saving…' : isEditMode() ? 'Update ward' : 'Create ward' }}
        </button>
      </div>
    </form>
  }
</div>
