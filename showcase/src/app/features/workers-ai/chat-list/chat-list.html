<div class="ChatList">
  @if (store.loadErrorMessage(); as errorMessage) {
    <p class="ChatList-error">{{ errorMessage }}</p>
  } @else {
    <div class="ChatList-row">
      @if (editing() && currentChat(); as chat) {
        <form class="ChatList-edit" (submit)="$event.preventDefault(); saveTitle(chat)">
          <input
            class="ChatList-control ChatList-editInput"
            [attr.aria-label]="'chat.list.chatName' | transloco"
            maxlength="60"
            [value]="editingTitle()"
            (input)="editingTitle.set($any($event.target).value)"
            [disabled]="saving()"
          />
          <button matIconButton type="submit" [attr.aria-label]="'chat.list.saveName' | transloco" [title]="'chat.list.save' | transloco" [disabled]="saving()">
            <mat-icon aria-hidden="true">check</mat-icon>
          </button>
          <button
            matIconButton
            type="button"
            [attr.aria-label]="'chat.list.cancelRenaming' | transloco"
            [title]="'chat.list.cancel' | transloco"
            [disabled]="saving()"
            (click)="cancelEditing()"
          >
            <mat-icon aria-hidden="true">close</mat-icon>
          </button>
        </form>
      } @else {
        <select
          class="ChatList-control ChatList-select"
          [attr.aria-label]="'chat.list.session' | transloco"
          [disabled]="store.chats().length === 0"
          (change)="openChat($any($event.target).value)"
        >
          <option value="" [selected]="!currentChat()" disabled>
            {{ (store.isLoading() ? 'chat.list.loading' : store.chats().length === 0 ? 'chat.list.none' : 'chat.list.select') | transloco }}
          </option>
          @for (chat of store.chats(); track chat.id) {
            <option [value]="chat.id" [selected]="chat.id === currentChatId()">
              {{ chat.title }} · {{ providerLabel(chat.provider) }}
            </option>
          }
        </select>
        @if (currentChat(); as chat) {
          <button
            matIconButton
            type="button"
            [attr.aria-label]="'chat.list.rename' | transloco"
            [title]="'chat.list.rename' | transloco"
            (click)="startEditing(chat)"
          >
            <mat-icon aria-hidden="true">edit</mat-icon>
          </button>
        }
      }
    </div>

    <div class="ChatList-row">
      <select
        class="ChatList-control ChatList-provider"
        [attr.aria-label]="'chat.list.providerForNew' | transloco"
        (change)="selectProvider($any($event.target).value)"
      >
        <option value="cloudflare" [selected]="selectedProvider() === 'cloudflare'">{{ 'chat.providers.cloudflare' | transloco }}</option>
        <option value="groq" [selected]="selectedProvider() === 'groq'">{{ 'chat.providers.groq' | transloco }}</option>
      </select>
      <button matButton="filled" type="button" (click)="newChat()" [disabled]="creating()">
        <mat-icon aria-hidden="true">add</mat-icon>
        {{ (creating() ? 'chat.list.creating' : 'chat.list.new') | transloco }}
      </button>
    </div>

    @if (renameError(); as errorMessage) {
      <p class="ChatList-error">{{ errorMessage }}</p>
    }
  }
</div>
