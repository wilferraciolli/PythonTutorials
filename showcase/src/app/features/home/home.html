<main class="Home">
  <mat-card class="Home-card" appearance="outlined">
    <mat-card-content class="Home-content">
      <h1 class="Home-title">FastAPI on Cloudflare D1</h1>
      <p class="Home-lead">
        A Python FastAPI service running as a Cloudflare Worker against a D1 database. Sign in with
        Clerk to get a session token for the API.
      </p>

      @if (auth.isSignedIn()) {
        <p class="Home-identity">Signed in as {{ signedInAs() }}</p>
        <button matButton="outlined" type="button" (click)="signOut()">Sign out</button>
      } @else {
        <button matButton="filled" type="button" (click)="signIn()">Sign in</button>
      }
    </mat-card-content>
  </mat-card>
</main>
