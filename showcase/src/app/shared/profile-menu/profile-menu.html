<div class="ProfileMenu">
  <button
    type="button"
    class="ProfileMenu-trigger App-button App-button-ghost App-button-icon"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="menu"
    [attr.aria-label]="i18n.t('navigation.profileMenu.accountMenu')"
    [attr.title]="i18n.t('navigation.profileMenu.accountMenu')"
  >
    <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
  </button>

  @if (isOpen()) {
    <div class="ProfileMenu-backdrop" (click)="close()"></div>
    <div class="ProfileMenu-dropdown" role="menu">
      <a class="ProfileMenu-item" routerLink="/board" (click)="close()">{{ i18n.t('navigation.navbar.beds') }}</a>
      <a class="ProfileMenu-item" routerLink="/profile" (click)="close()">{{ i18n.t('navigation.profileMenu.viewProfile') }}</a>
      <a class="ProfileMenu-item" routerLink="/insights" (click)="close()">{{ i18n.t('navigation.profileMenu.insights') }}</a>
      @if (currentUser.isAdmin()) {
        <a class="ProfileMenu-item" routerLink="/admin" (click)="close()">{{ i18n.t('navigation.profileMenu.adminDashboard') }}</a>
      }
      <button type="button" class="ProfileMenu-item ProfileMenu-item-danger" (click)="signOut()">{{ i18n.t('common.buttons.signOut') }}</button>
    </div>
  }
</div>
