<mat-toolbar class="NavBar">
  <a class="NavBar-brand" routerLink="/">{{ 'nav.brand' | transloco }}</a>
  <span class="NavBar-spacer"></span>

  @if (auth.isSignedIn()) {
    <app-profile-menu />
  } @else {
    <button matButton="filled" type="button" (click)="signIn()">{{ 'nav.signIn' | transloco }}</button>
  }
</mat-toolbar>
